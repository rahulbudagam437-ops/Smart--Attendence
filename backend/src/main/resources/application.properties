# =====================================================================
# SMART ATTENDANCE SYSTEM (ADVANCED) - MAIN APPLICATION CONFIGURATION
# =====================================================================

spring.application.name=smart-attendance-backend
server.port=${PORT:8080}

# Default Active Profile: dev (H2 in-memory with MySQL compatibility for instant out-of-the-box local demo)
# To use MySQL 8.x: run with --spring.profiles.active=mysql or set SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:4c8a9f6e3d2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
